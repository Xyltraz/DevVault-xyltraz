[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devvault-xyltraz"
version = "2.0.0"
description = "A simple local key/value vault with a Python API and CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xyltraz" }]
keywords = ["env", "secrets", "configuration", "vault"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.scripts]
devvault = "devvault_cli:main"

[tool.setuptools]
packages = ["DevVault"]
py-modules = ["devvault_cli"]
